name: Build Kivy APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    # 🔑 使用 Kivy 官方 Docker 镜像
    - name: Build APK with Docker
      run: |
        docker run --rm \
          -v $(pwd):/app \
          -v ~/.buildozer:/home/user/.buildozer \
          kivy/buildozer:latest \
          buildozer android debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: bin/*.apk