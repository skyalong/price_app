name: Build Kivy APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Python 3.11
        run: |
          apt-get update
          apt-get install -y software-properties-common
          add-apt-repository ppa:deadsnakes/ppa -y
          apt-get update
          apt-get install -y python3.11 python3.11-dev python3.11-venv python3-pip
          update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.11 1
          update-alternatives --set python3 /usr/bin/python3.11
          rm -rf /home/user/.venv
          python3 -m venv /home/user/.venv
          . /home/user/.venv/bin/activate
          pip install --upgrade pip
          pip install buildozer cython

      # 🔑 先运行一次 Buildozer 来下载 p4a（会失败但没关系）
      - name: Initialize Buildozer and download p4a
        run: |
          . /home/user/.venv/bin/activate
          yes | buildozer android debug || true

      # 🔑 现在 p4a 已经下载，修改 hostpython3 版本
      - name: Fix p4a Python version
        run: |
          sed -i 's/version = "3.14.2"/version = "3.11.9"/g' /__w/price_app/price_app/.buildozer/android/platform/python-for-android/pythonforandroid/recipes/hostpython3/__init__.py || true
          sed -i 's/version = "3.14.2"/version = "3.11.9"/g' /__w/price_app/price_app/.buildozer/android/platform/python-for-android/pythonforandroid/recipes/python3/__init__.py || true
          # 清理构建目录，让 Buildozer 重新开始
          rm -rf /__w/price_app/price_app/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a

      - name: Build APK
        run: |
          . /home/user/.venv/bin/activate
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: price-app
          path: bin/*.apk
