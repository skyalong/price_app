name: Build Kivy APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Python 3.11 and fix p4a
        run: |
          apt-get update
          apt-get install -y software-properties-common
          add-apt-repository ppa:deadsnakes/ppa -y
          apt-get update
          apt-get install -y python3.11 python3.11-dev python3.11-venv python3-pip
          # 切换默认 Python 到 3.11
          update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.11 1
          update-alternatives --set python3 /usr/bin/python3.11
          # 删除旧的虚拟环境
          rm -rf /home/user/.venv
          # 使用 Python 3.11 创建新的虚拟环境
          python3 -m venv /home/user/.venv
          . /home/user/.venv/bin/activate
          pip install --upgrade pip
          pip install buildozer cython
          
          # 🔑 关键：修改 p4a 中的 hostpython3 版本
          sed -i 's/version = "3.14.2"/version = "3.11.9"/g' /__w/price_app/price_app/.buildozer/android/platform/python-for-android/pythonforandroid/recipes/hostpython3/__init__.py
          sed -i 's/version = "3.14.2"/version = "3.11.9"/g' /__w/price_app/price_app/.buildozer/android/platform/python-for-android/pythonforandroid/recipes/python3/__init__.py

      - name: Build APK
        run: |
          . /home/user/.venv/bin/activate
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: price-app
          path: bin/*.apk
