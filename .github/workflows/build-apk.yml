name: Build Kivy APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            python3-pip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install cython buildozer

      # 🔑 关键步骤：先接受许可证，再安装指定版本的 Build Tools
      - name: Accept licenses and install Build Tools 34
        run: |
          # 创建目录并接受所有许可证
          mkdir -p ~/.android
          echo "### User Sources for Android SDK Manager" > ~/.android/repositories.cfg
          
          # 先运行一次 buildozer 来初始化 SDK
          buildozer android debug || true
          
          # 接受所有许可证
          yes | ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --licenses || true
          
          # 安装指定版本的 Build Tools
          ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --sdk_root=/home/runner/.buildozer/android/platform/android-sdk "build-tools;34.0.0"

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: price-app
          path: bin/*.apk